calendar_version: "1.0"

timezone: "Asia/Kolkata"

execution_mode:
  # HISTORICAL_REPLAY = dispatch calculation starts from order creation timestamp
  # CURRENT_PENDING = dispatch calculation starts from current run timestamp
  mode: "CURRENT_PENDING"

default_calendar:
  working_days:
    - MON
    - TUE
    - WED
    - THU
    - FRI
    - SAT

  working_hours:
    start: "09:00"
    end: "18:00"

  non_working_days:
    - SUN

  allowed_order_types:
    - VOR
    - ACC
    - REPLENISHMENT
    - PUSH

locations:
