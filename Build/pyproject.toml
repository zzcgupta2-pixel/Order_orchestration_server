[project]
name = "order-orchestration"
version = "0.1.0"
description = "Deterministic rule-based order orchestration engine for aftermarket dealer orders"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88